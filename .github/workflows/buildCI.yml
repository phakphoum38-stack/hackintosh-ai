name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run app
        run: |
          cd backend
          python main.py

      - name: Test API
        run: |
          cd backend
          timeout 10s uvicorn main:app --host 0.0.0.0 --port 8000
